apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
    environment: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app  # Selects pods with this label
  template:
    metadata:
      labels:
        app: my-app
        environment: dev
    spec:
      containers:
      - name: my-app-container
        image: nginx:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: my-app-service
  labels:
    app: my-app
spec:
  selector:
    app: my-app  # Selects pods with this label
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
