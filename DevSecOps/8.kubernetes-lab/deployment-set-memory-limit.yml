apiVersion: apps/v1
kind: Deployment
metadata:
  name: cefalo-test
  labels:
    app: cefalo-app
    type: front-end
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: cefalo-app
      type: front-end
  template:
    metadata:
      labels:
        app: cefalo-app
        type: front-end
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.25.3
        resources:
          requests:
            memory: "2048Mi"
          limits:
            memory: "4096Mi"
